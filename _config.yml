# Site settings
title: Ayesha Asloob Qureshi
description: >-
  Associate Professor of Mathematics at Sabancı Üniversitesi, Istanbul.
  Research in commutative algebra, combinatorics and algebraic statistics.
lang: en
url: "https://ayeshaasloob.github.io"
baseurl: "/ayeshasloob-website"

# Visual style: modern, classic, grid, journal or tiling (see _data/styles.yml).
style: modern

# Animated background, for styles that show one (Modern, Classic):
#   polyominoes, edge-ideals or none
background: polyominoes

# Set to true by the PR preview build: shows a banner and stops search engines indexing.
preview: false

# Build
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Published as-is so GitHub Pages does not re-run Jekyll on the built output.
include:
  - .nojekyll

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - scripts
  # Full-size camera originals: keep out of the site (the web copy is assets/img/profile.jpg)
  - assets/img/ALI03424.JPG

defaults:
  - scope:
      path: ""
    values:
      layout: page
      # Image used when a page is shared on social media or messaging apps.
      image: /assets/img/profile.jpg
