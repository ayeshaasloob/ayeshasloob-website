# Builds every pull request into main and publishes it at
#   <site url>/pr-preview/pr-<number>/
# The link is posted as a comment on the PR. The preview is removed when the PR is closed.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        if: github.event.action != 'closed'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build preview
        if: github.event.action != 'closed'
        run: |
          BASEURL=$(ruby -ryaml -e 'puts YAML.load_file("_config.yml")["baseurl"]')
          PREVIEW_BASEURL="${BASEURL}/pr-preview/pr-${{ github.event.number }}"
          printf 'preview: true\nbaseurl: "%s"\n' "$PREVIEW_BASEURL" > _config.preview.yml
          # Open the preview in the same style the live site uses; the Style menu can switch it.
          if [ -n "$VAR_STYLE" ]; then printf 'style: %s\n' "$VAR_STYLE" >> _config.preview.yml; fi
          if [ -n "$VAR_BACKGROUND" ]; then printf 'background: %s\n' "$VAR_BACKGROUND" >> _config.preview.yml; fi
          bundle exec jekyll build --config _config.yml,_config.preview.yml
          echo "PREVIEW_BASEURL=$PREVIEW_BASEURL" >> "$GITHUB_ENV"
        env:
          JEKYLL_ENV: production
          VAR_STYLE: ${{ vars.SITE_STYLE }}
          VAR_BACKGROUND: ${{ vars.SITE_BACKGROUND }}

      - name: Check links and HTML
        if: github.event.action != 'closed'
        run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https --swap-urls "^${PREVIEW_BASEURL}:"

      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
