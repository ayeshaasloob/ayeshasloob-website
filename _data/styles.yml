# Available visual styles. Choose one with `style:` in _config.yml.
# Each has a stylesheet at assets/css/<name>.css and its Google Fonts URL.
- name: modern
  label: Modern
  fonts: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap
- name: classic
  label: Classic
  fonts: https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600&display=swap
- name: grid
  label: Grid
  fonts: https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap
- name: journal
  label: Journal
  fonts: https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap
- name: tiling
  label: Tiling
  fonts: https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap
