<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <canvas class="bg-anim" data-scene="{{ site.background | default: 'polyominoes' }}" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main">Skip to content</a>
  {% if site.preview %}
  <div class="preview-banner" role="status">Preview build. This is not the live site.</div>
  {% endif %}
  {% include header.html %}
  <main id="main" class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if site.preview or jekyll.environment == "development" %}{% include style-switcher.html %}{% endif %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/background.js' | relative_url }}" defer></script>
</body>
</html>
